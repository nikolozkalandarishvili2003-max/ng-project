<div class="video-bg">
  <video autoplay muted loop src="/assets/car3.mp4"></video>
</div>

<form (ngSubmit)="onsubmit()" #signInForm="ngForm">
  <h1>Sign in</h1>
  <input
    type="tel"
    name="phoneNumber"
    placeholder="PhoneNumber"
    required
    [(ngModel)]="signindata.phoneNumber"
  />
  <input
    type="password"
    name="password"
    placeholder="Enter password"
    [(ngModel)]="signindata.password"
    required
    minlength="4"
  />
  <button class="btn">Sign in</button>
  <p>dont have accaunt? <a routerLink="/sign-up">register now</a></p>
</form>
